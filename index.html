<title>Stock Desk Live</title>
<style>
:root{color-scheme:dark;--card:#0e0f12;--line:#23262d;--tx:#e8eaed;--mut:#8b919c;--up:#2ecc71;--dn:#ff5a5f;--ac:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--tx);font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}
button{font:inherit;color:inherit;cursor:pointer}.sp{flex:1}.logo{font-weight:700}
.ic{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:18px}
.mini{position:relative}.mini>button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.minipanel{display:none;position:absolute;right:0;top:44px;width:280px;max-width:86vw;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:60vh;overflow:auto}
.mini.open .minipanel{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px}.row:hover{background:#17191e}.row b{cursor:pointer}
.x{background:none;border:0;color:var(--mut)}
nav{display:none;position:fixed;left:0;top:59px;bottom:0;width:220px;background:#07080a;border-right:1px solid var(--line);padding:12px;z-index:25}
nav.open{display:block}nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px;border-radius:8px}nav button.on,nav button:hover{background:#17191e}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.btn{background:var(--ac);color:#001;border:0;border-radius:8px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-block}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}

.price{font-size:30px;font-weight:700}.verdict{font-size:28px;font-weight:800}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}a{color:var(--ac)}.err{color:var(--dn)}

aside{display:none}

.kv{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.kv b{display:block}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}#tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;white-space:nowrap;color:var(--mut)}#tabs button.on,#tabs button:hover{background:#17191e;color:var(--tx)}@media(max-width:700px){.logo{font-size:12px}}
.logo{cursor:pointer;font-weight:800;letter-spacing:1.5px;background:linear-gradient(90deg,#4da3ff,#2ecc71);-webkit-background-clip:text;background-clip:text;color:transparent}

.pills{display:flex;gap:8px;margin-bottom:14px}.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;color:var(--mut)}.pill.on{background:var(--tx);color:#000;border-color:var(--tx)}
.cb{display:inline-block;background:#1b2a3d;color:#7fbcff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px}
.frm{display:flex;gap:8px;flex-wrap:wrap}.frm input{flex:1;min-width:90px;margin:0}
.tip{border-bottom:1px dotted var(--mut);cursor:help}
#pop{display:none;position:fixed;z-index:50;max-width:300px;background:#15171c;border:1px solid #3a3f4a;border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 30px #000}#pop b{display:block;margin-bottom:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:"▸ ";color:var(--mut)}details[open]>summary::before{content:"▾ "}details>.in{padding:0 14px 14px}details details{background:#000}
select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin:4px 0}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K0={"fk": "dbbe5thr01qrv06qhg3gdbbe5thr01qrv06qhg40", "gk": "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", "tk": "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"};

let HZ=parseInt(ls.g("hz"))||3;
let POS=JSON.parse(ls.g("pos")||"[]");
let wl=JSON.parse(ls.g("wl")||"[]"),FK=ls.g("fk")||K0.fk,TK=ls.g("tk")||K0.tk,PV=ls.g("pv")==="openrouter"?"openrouter":"groq",GK=ls.g("gk")||K0.gk,GM=ls.g("gm")||"",SYMS=[],cur="news",Q={};

const HELP={groq:'Free, no credit card. Sign in at <a href="https://console.groq.com" target="_blank" rel="noopener">console.groq.com</a>, open API Keys, and create a key. Tip: type groq/compound as the model name to use Groq’s built-in web search.',openrouter:'Free models have daily limits. Create a key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. Free model names end in :free.'};
if(GM==="llama-3.3-70b-versatile"){GM="";ls.s("gm","")}
const saveWL=()=>{ls.s("wl",JSON.stringify(wl));renderMini();pollQuotes()};
const fh=async(p,o={})=>{if(!FK)throw new Error("Add your Finnhub key under ⚙ API keys.");const u=new URL("https://finnhub.io/api/v1/"+p);Object.entries({...o,token:FK}).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);if(r.status===429)throw new Error("Finnhub rate limit hit. Wait a minute.");if(!r.ok)throw new Error("Finnhub error "+r.status);return r.json()};
const fmt=n=>n==null?"–":Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const chg=q=>q&&q.c?`<span class="${q.dp>=0?"up":"dn"}">${q.dp>=0?"+":""}${fmt(q.dp)}%</span>`:"";
async function loadSyms(){if(SYMS.length)return;try{const c=ls.g("syms2");if(c){const o=JSON.parse(c);if(Date.now()-o.t<6048e5){SYMS=o.d;return}}}catch(e){}
const out=[];for(const [mic,lab] of [["XNYS","NYSE"],["XNAS","Nasdaq"],["XASE","NYSE American"]]){try{const d=await fh("stock/symbol",{exchange:"US",mic});d.filter(x=>x.type==="Common Stock"||x.type==="ETP").forEach(x=>out.push({s:x.symbol,n:x.description,x:lab}))}catch(e){if(!out.length)throw e}}
SYMS=out;try{ls.s("syms2",JSON.stringify({t:Date.now(),d:SYMS}))}catch(e){}}
const nm=s=>(SYMS.find(t=>t.s===s)||{n:s}).n;
async function pollQuotes(){if(!FK)return;for(const s of new Set(wl.concat(POS.map(p=>p.s)))){try{Q[s]=await fh("quote",{symbol:s})}catch(e){break}}renderMini();if(cur==="watch")pWatch();if(cur==="pos"&&$("#pl"))posList()}
setInterval(pollQuotes,30000);
function renderMini(){$("#mc").textContent=wl.length;const h=wl.length?wl.map(s=>`<div class="row"><b data-r="${s}">${s}</b><span>${Q[s]&&Q[s].c?fmt(Q[s].c)+" "+chg(Q[s]):""}</span><button class="x" data-d="${s}">✕</button></div>`).join(""):'<div class="mut" style="padding:8px">Nothing yet.</div>';$("#miniPanel").innerHTML=h;const sl=$("#sl");if(sl)sl.innerHTML=h}
$("#miniBtn").onclick=e=>{e.stopPropagation();$("#mini").classList.toggle("open")};
document.addEventListener("click",e=>{if(!e.target.closest("#mini"))$("#mini").classList.remove("open");const d=e.target.dataset;if(d.d){wl=wl.filter(x=>x!==d.d);saveWL();if(cur==="watch")pWatch()}if(d.r){$("#mini").classList.remove("open");research(d.r)}});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.p));$("#home").onclick=()=>go("home");
function go(p){cur=p;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));({home:pHome,news:pNews,hot:pHot,research:pRes,pos:pPos,watch:pWatch,settings:pSet})[p]()}
function pSet(){$("#main").innerHTML=`<h1>API keys</h1><div class="card"><h2>Finnhub (required, free)</h2><div class="mut">Live prices, the NYSE ticker list and news. Get a free key at <a href="https://finnhub.io" target="_blank" rel="noopener">finnhub.io</a>.</div><input type="password" id="fk" value="${esc(FK)}" placeholder="Finnhub API key"></div>
<div class="card"><h2>AI write-up (optional, free)</h2><div class="mut">Everything else works without this.</div><select id="pv"><option value="groq">Groq</option><option value="openrouter">OpenRouter</option></select><div class="mut" id="ph">${HELP[PV]}</div><input type="password" id="gk" value="${esc(GK)}" placeholder="API key"><input type="text" id="gm" value="${esc(GM||DEF[PV])}" placeholder="Model name"><div class="mut">If you see a “model not found” error, copy a current free model name from the provider’s model list.</div></div><div class="card"><h2>Web search for the AI write-up (optional, free)</h2><div class="mut">Gives the AI fresh news from the web. Free plan: 1,000 searches a month, no card, at <a href="https://tavily.com" target="_blank" rel="noopener">tavily.com</a>. One search is used per AI write-up.</div><input type="password" id="tk" value="${esc(TK)}" placeholder="Tavily API key"></div><div class="card"><h2>Your holding period</h2><div class="mut">Months until you plan to sell. The score weighting, strategy and AI write-up are tailored to it.</div><input type="text" id="hz" value="${HZ}" style="width:100px"> months</div><button class="btn" id="sv">Save</button> <span id="ok" class="mut"></span><p class="mut">Keys are stored only in this browser and sent only to Finnhub and Google.</p>`;
$("#pv").value=PV;$("#pv").onchange=()=>{const k=$("#pv").value,o=$("#gm");$("#ph").innerHTML=HELP[k];if(!o.value||Object.values(DEF).includes(o.value))o.value=DEF[k]};
$("#sv").onclick=()=>{FK=$("#fk").value.trim();PV=$("#pv").value;GK=$("#gk").value.trim();GM=$("#gm").value.trim()||DEF[PV];ls.s("fk",FK);HZ=Math.max(1,Math.min(24,parseInt($("#hz").value)||3));ls.s("hz",HZ);TK=$("#tk").value.trim();ls.s("tk",TK);ls.s("pv",PV);ls.s("gk",GK);ls.s("gm",GM);$("#ok").textContent="Saved.";pollQuotes()}}
const ago=t=>{const m=Math.max(1,Math.round((Date.now()/1000-t)/60));return m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const ncard=(n,f)=>{const sm=String(n.summary||""),L=f?260:140;return '<a class="nc'+(f?' feat':'')+'" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+(n.image?'<img src="'+esc(n.image)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<div class="b"><div class="mut" style="text-transform:uppercase;letter-spacing:.5px;font-size:11px">'+(n.tag?'<span class="cb">'+esc(n.tag)+'</span>':'')+esc(n.source)+' · '+ago(n.datetime)+'</div><h3>'+esc(n.headline)+'</h3><p>'+esc(sm.slice(0,L))+(sm.length>L?"…":"")+'</p></div></a>'};
function spread(a,max,cap){a=a.slice().sort((x,y)=>y.datetime-x.datetime);const g={};a.forEach(x=>{(g[x.source]=g[x.source]||[]).push(x)});const ks=Object.keys(g).sort((p,q)=>g[q][0].datetime-g[p][0].datetime),out=[];for(let r=0;r<cap&&out.length<max;r++)for(const k of ks)if(g[k][r]&&out.length<max)out.push(g[k][r]);return out.sort((x,y)=>y.datetime-x.datetime)}
let NP=null;const NC={},QP={},AIC={};
async function newsPool(){if(NP&&Date.now()-NP.t<6e5)return NP.list;const t=new Date().toISOString().slice(0,10),f=new Date(Date.now()-3*864e5).toISOString().slice(0,10);
let all=await fh("news",{category:"general"});const jobs=[fh("news",{category:"merger"}).then(x=>all.push(...x)).catch(()=>{})];
for(const s of ["AAPL","MSFT","NVDA","AMZN","JPM","XOM","TSLA","WMT"])jobs.push(fh("company-news",{symbol:s,from:f,to:t}).then(x=>all.push(...x.slice(0,15))).catch(()=>{}));
await Promise.all(jobs);const seen=new Set();const list=all.filter(x=>x.headline&&x.source&&!seen.has(x.headline)&&seen.add(x.headline)).sort((x,y)=>y.datetime-x.datetime);NP={t:Date.now(),list};return list}
async function pNews(src){src=typeof src==="string"?src:"all";$("#main").innerHTML='<h1>Business news</h1><div style="margin-bottom:14px"><select id="ns" style="max-width:340px"><option value="all">All sources, mixed</option></select></div><div id="ng" class="mut">Loading…</div>';
if(!FK){$("#ng").innerHTML='<span class="err">Add your Finnhub key under ⚙ API keys.</span>';return}
try{const L=await newsPool(),cnt={};L.forEach(x=>cnt[x.source]=(cnt[x.source]||0)+1);const sel=$("#ns");if(!sel)return;Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k+" ("+cnt[k]+")";sel.appendChild(o)});sel.value=cnt[src]?src:"all";sel.onchange=()=>pNews(sel.value);
const n=sel.value==="all"?spread(L,24,3):L.filter(x=>x.source===sel.value).slice(0,30);const fi=n.findIndex(x=>x.image);if(fi>0)n.unshift(n.splice(fi,1)[0]);$("#ng").className="ng";$("#ng").innerHTML=n.map((x,i)=>ncard(x,i===0)).join("")}catch(e){const g=$("#ng");if(g)g.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function posCalc(){let inv=0,val=0;POS.forEach(p=>{const c=Q[p.s]&&Q[p.s].c;inv+=p.sh*p.bp;val+=p.sh*(c||p.bp)});return{inv,val,pl:val-inv,pct:inv?(val-inv)/inv*100:0}}
let CASH=parseFloat(ls.g("cash"))||0;
let HC=Object.assign({order:["acct","idx","wlp","news"],hide:[],idx:["SPY","DIA","QQQ","IWM"],wlOff:[]},JSON.parse(ls.g("hc")||"{}"));
["acct","idx","wlp","news"].forEach(k=>{if(!HC.order.includes(k))HC.order.push(k)});
const SEC={acct:"Account & positions",idx:"Market",wlp:"Watchlist prices",news:"Watchlist news"},INAME={SPY:"S&P 500",DIA:"Dow Jones",QQQ:"Nasdaq 100",IWM:"Russell 2000",VTI:"Total US market",XLK:"Tech sector",XLF:"Financials",XLE:"Energy",XLV:"Health care"};
